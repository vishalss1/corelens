name: CoreLens CI
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm ninja-build
      - name: Build native profiler
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DCORELENS_BUILD_TESTS=ON && cmake --build build
      - name: Native regression checks
        run: ctest --test-dir build --output-on-failure
      - name: Install Python CLI
        run: python -m pip install .
      - name: Python regression checks
        run: python -m unittest discover -s tests -p test_python.py -v
      - name: Integration checks
        run: python tests/integration.py --native build/corelens-native
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native profiler
        run: cmake -S . -B build -DCORELENS_BUILD_TESTS=ON; cmake --build build --config Release
      - name: Native regression checks
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install Python CLI
        run: python -m pip install .
      - name: Python regression checks
        run: python -m unittest discover -s tests -p test_python.py -v
