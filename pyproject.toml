[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corelens"
version = "0.1.0"
description = "CPU performance profiling and measured optimization experiments"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
corelens = "corelens.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
